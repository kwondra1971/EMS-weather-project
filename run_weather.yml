name: Daily Open Meteo Archive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-weather:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('httr','jsonlite','dplyr'), repos='https://cloud.r-project.org')"

      - name: Run R script
        run: |
          Rscript daily_forecast_collector_github.R

      - name: Save CSV output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily forecast update"
